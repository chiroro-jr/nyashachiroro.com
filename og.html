<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>OG Image — Nyasha D. Chiroro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,800;1,9..144,400&family=Outfit:wght@300;500&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 1200px;
      height: 630px;
      overflow: hidden;
    }

    body {
      font-family: 'Outfit', system-ui, sans-serif;
      background: #08080c;
      color: #eceaf2;
      position: relative;
    }

    body::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.05'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 2;
    }

    .glow {
      position: absolute;
      border-radius: 50%;
      filter: blur(100px);
      pointer-events: none;
    }
    .glow--1 {
      width: 520px;
      height: 520px;
      top: -180px;
      right: -80px;
      background: rgba(126, 1, 212, 0.35);
    }
    .glow--2 {
      width: 360px;
      height: 360px;
      bottom: -120px;
      left: -60px;
      background: rgba(126, 1, 212, 0.12);
    }

    .grid {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.05) 1px, transparent 1px);
      background-size: 48px 48px;
      mask-image: radial-gradient(ellipse 85% 75% at 35% 45%, black 15%, transparent 72%);
      opacity: 0.45;
    }

    .frame {
      position: relative;
      z-index: 1;
      width: 1200px;
      height: 630px;
      padding: 64px 72px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border: 1px solid rgba(126, 1, 212, 0.2);
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    .logo {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 22px;
      font-weight: 500;
      letter-spacing: 0.02em;
    }
    .logo span { color: #a855f7; }

    .eyebrow {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 13px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #a855f7;
      text-align: right;
      line-height: 1.6;
    }

    .main {
      max-width: 900px;
    }

    .name {
      font-family: 'Fraunces', Georgia, serif;
      font-size: 72px;
      font-weight: 800;
      line-height: 1.02;
      letter-spacing: -0.03em;
      margin-bottom: 20px;
    }

    .tagline {
      font-family: 'Fraunces', Georgia, serif;
      font-size: 36px;
      font-weight: 400;
      font-style: italic;
      color: #a855f7;
      line-height: 1.2;
      margin-bottom: 28px;
    }

    .role {
      font-size: 26px;
      font-weight: 300;
      color: #8a8698;
      line-height: 1.4;
    }

    .bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 32px;
      border-top: 1px solid rgba(255, 255, 255, 0.07);
    }

    .domain {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 15px;
      letter-spacing: 0.08em;
      color: #5c5868;
    }

    .badge {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 12px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #a855f7;
      background: rgba(126, 1, 212, 0.12);
      border: 1px solid rgba(126, 1, 212, 0.25);
      padding: 10px 16px;
      border-radius: 2px;
    }
  </style>
</head>
<body>
  <div class="glow glow--1" aria-hidden="true"></div>
  <div class="glow glow--2" aria-hidden="true"></div>
  <div class="grid" aria-hidden="true"></div>

  <div class="frame">
    <div class="top">
      <p class="logo">NDC<span>.</span></p>
      <p class="eyebrow">Full Stack Developer<br>Harare, Zimbabwe</p>
    </div>

    <div class="main">
      <h1 class="name">Nyasha D. Chiroro</h1>
      <p class="tagline">Software that moves businesses forward.</p>
      <p class="role">React · TypeScript · TanStack · PostgreSQL</p>
    </div>

    <div class="bottom">
      <span class="domain">nyashachiroro.com</span>
      <span class="badge">Available for work</span>
    </div>
  </div>
</body>
</html>
